server {
    # 全てのIPアドレス（0.0.0.0）からのポート80番での通信を受け付けます
    listen       0.0.0.0:80;
    
    # 全てのホスト名（ドメイン）に対するリクエストを処理します
    server_name  _;
    
    # デフォルトの文字コードをUTF-8に指定します
    charset      utf-8;
    
    # リクエストボディの最大サイズを6MBに設定します
    # （PHPの5MB制限に対し、通信ヘッダー等のデータ量を考慮して少し余裕を持たせています）
    client_max_body_size 6M;

    # 公開するファイルのルートディレクトリを指定します
    root /var/www/public;

    # 拡張子が .php のファイルに対するリクエスト処理を定義します
    location ~ \.php$ {
        # PHPの処理をPHP-FPMコンテナ（コンテナ名: php、ポート: 9000）へ転送します
        fastcgi_pass  php:9000;
        
        # ディレクトリへのアクセス時にデフォルトで読み込むファイルを指定します
        fastcgi_index index.php;
        
        # 実行するPHPファイルの絶対パスをサーバーに伝えます
        fastcgi_param SCRIPT_FILENAME  $document_root$fastcgi_script_name;
        
        # その他のFastCGI関連の標準パラメータを読み込みます
        include       fastcgi_params;
    }

    # /image/ から始まるURLへのアクセスに対する処理を定義します
    location /image/ {
        # 画像ファイルが保存されているディレクトリ（/var/www/upload）へ紐付けます
        root /var/www/upload;
    }
}
